[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "scanexplain"
version = "0.1.0"
description = "Research prototype for reviewing medical-imaging model behavior"
requires-python = ">=3.9"

[project.optional-dependencies]
api = [
  "fastapi>=0.110,<1",
  "uvicorn[standard]>=0.27,<1",
  "python-multipart>=0.0.9",
  "numpy>=1.22",
  "Pillow>=9",
]

[tool.setuptools.packages.find]
include = ["scanexplain*"]
